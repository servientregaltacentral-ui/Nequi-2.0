<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Central de Cobros PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
font-family:Inter;
}

body{
background:#f4f6f9;
margin:0;
padding:20px;
}

.container{
max-width:520px;
margin:auto;
background:white;
border-radius:12px;
padding:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h2{
text-align:center;
}

input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
margin-top:10px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:8px;
margin-top:10px;
cursor:pointer;
font-size:15px;
}

.btn{
background:#00a859;
color:white;
}

.btn2{
background:#1877f2;
color:white;
}

.card{
background:#f7f7f7;
padding:12px;
border-radius:8px;
margin-top:10px;
}

.estado{
font-weight:bold;
}

.menu button{
width:48%;
}

.menu{
display:flex;
gap:4%;
margin-bottom:15px;
}

</style>

</head>

<body>

<div class="container">

<h2>Central de Cobros</h2>

<div class="menu">

<button class="btn2" onclick="mostrar('crear')">
Crear Pedido
</button>

<button class="btn2" onclick="mostrar('ventas')">
Dashboard
</button>

</div>

<div id="crear">

<input id="cliente" placeholder="Cliente">

<input id="telefono" placeholder="WhatsApp">

<input id="producto" placeholder="Producto">

<input id="valor" placeholder="Valor">

<button class="btn" onclick="crearPedido()">
Generar Cobro
</button>

<div id="resultado"></div>

</div>

<div id="ventas" style="display:none">

<h3>Ventas</h3>

<div id="total"></div>

<h3>Historial</h3>

<div id="historial"></div>

</div>

</div>

<script>

const linkPago = "https://checkout.wompi.co/l/vwXEUI"

let pedidos = JSON.parse(localStorage.getItem("pedidos")) || []

function mostrar(pantalla){

document.getElementById("crear").style.display="none"
document.getElementById("ventas").style.display="none"

document.getElementById(pantalla).style.display="block"

if(pantalla==="ventas"){
mostrarVentas()
}

}

function crearPedido(){

let cliente=document.getElementById("cliente").value
let telefono=document.getElementById("telefono").value
let producto=document.getElementById("producto").value
let valor=document.getElementById("valor").value

if(!cliente || !telefono || !valor){
alert("Completa los campos")
return
}

let pedido={
id:Date.now(),
cliente,
telefono,
producto,
valor,
fecha:new Date().toLocaleString(),
estado:"pendiente"
}

pedidos.push(pedido)

localStorage.setItem("pedidos",JSON.stringify(pedidos))

document.getElementById("resultado").innerHTML="Cobro creado"

enviarWhatsApp(pedido)

}

function enviarWhatsApp(pedido){

let mensaje =
"Hola "+pedido.cliente+
"%0AProducto: "+pedido.producto+
"%0AValor: $"+pedido.valor+
"%0APagar aquí: "+linkPago

window.open(
"https://wa.me/"+pedido.telefono+"?text="+mensaje
)

}

function marcarPagado(id){

pedidos=pedidos.map(p=>{

if(p.id===id){
p.estado="pagado"
}

return p

})

localStorage.setItem("pedidos",JSON.stringify(pedidos))

mostrarVentas()

}

function mostrarVentas(){

let html=""
let total=0

pedidos.slice().reverse().forEach(p=>{

if(p.estado==="pagado"){
total+=Number(p.valor)
}

html+=`

<div class="card">

Cliente: ${p.cliente}<br>
Producto: ${p.producto}<br>
Valor: $${p.valor}<br>
Estado: <span class="estado">${p.estado}</span>

<br>

<button class="btn2"
onclick='enviarWhatsApp(${JSON.stringify(p)})'>
Enviar WhatsApp
</button>

<button class="btn"
onclick='marcarPagado(${p.id})'>
Marcar Pagado
</button>

</div>

`

})

document.getElementById("historial").innerHTML=html

document.getElementById("total").innerHTML=
"<b>Total pagado: $"+total+"</b>"

}

</script>

</body>
</html>
