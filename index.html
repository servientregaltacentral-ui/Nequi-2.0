<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Central de Cobros</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:30px;
}

.card{
max-width:420px;
margin:auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h2{
text-align:center;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border-radius:6px;
border:1px solid #ccc;
}

button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

.pagar{
background:#00a859;
color:white;
}

.whatsapp{
background:#25D366;
color:white;
}

</style>

</head>

<body>

<div class="card">

<h2>Pedido</h2>

<input id="cliente" placeholder="Nombre del cliente">

<input id="telefono" placeholder="WhatsApp">

<input id="producto" placeholder="Producto">

<input id="valor" placeholder="Valor">

<button class="pagar" onclick="pagar()">Pagar con Wompi</button>

<button class="whatsapp" onclick="enviar()">Enviar cobro por WhatsApp</button>

</div>

<script>

const linkPago = "https://checkout.wompi.co/l/vwXEUI"

function pagar(){

window.open(linkPago)

}

function enviar(){

let cliente = document.getElementById("cliente").value
let telefono = document.getElementById("telefono").value
let producto = document.getElementById("producto").value
let valor = document.getElementById("valor").value

let mensaje =
"Hola "+cliente+
"%0ATu pedido: "+producto+
"%0AValor: $"+valor+
"%0APagar aquí: "+linkPago

window.open(
"https://wa.me/"+telefono+"?text="+mensaje
)

}

</script>

</body>
</html>
